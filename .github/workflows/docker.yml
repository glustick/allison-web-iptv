name: Docker

# Builds and publishes a multi-arch image (linux/amd64 + linux/arm64) to GitHub Container
# Registry on every push to main and on version tags — linux/arm64 specifically because a
# Synology NAS (this project's own first real deployment target beyond a dev machine) is very
# often ARM-based, not just Intel/AMD. QEMU (setup-qemu-action) is what lets the amd64 GitHub
# runner actually build the arm64 image, not just claim to.
on:
  push:
    branches: [main]
    tags: ['v*']
    # A documentation-only push (README/ROADMAP/EFFORT-ASSESSMENT) no longer triggers a full
    # multi-arch build — ~13–20 min, linux/arm64 better-sqlite3 under QEMU. Until now that depended
    # on remembering `[skip ci]` in the commit message; the filter makes it automatic. A push that
    # touches any non-`.md` file still builds, and `workflow_dispatch` stays the manual override.
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

jobs:
  # The gate. Until 2026-09-20 this workflow only built and pushed, so a release with failing tests,
  # a type error or a lint error published anyway — which is how a duplicate switch case (unreachable
  # dead code) reached a tag, and how v0.31.0 shipped with two failing tests. The image build now
  # depends on it, so none of those can be published at all.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  # The scripted browser pass (v0.106.0): the same verify-ui.mjs that found the v0.100.0
  # logEvent recursion, run on every push that builds an image — so "not browser-verified"
  # stops being the default state of a release. It runs the whole app from the built
  # artifacts (dist + public) against the fixture provider, in real Chrome, and its failures
  # block the image exactly like a failing unit test would.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build && npm run build:client

      # The fixture provider must be addressed by a non-loopback IP: the app refuses provider
      # URLs that point at loopback (SSRF posture), which on a runner means its own LAN IP.
      - name: Start the fixture provider
        run: |
          RUNNER_IP="$(hostname -I | awk '{print $1}')"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          FFMPEG="$PWD/node_modules/ffmpeg-static/ffmpeg" PORT=8091 node scripts/fixture-provider.mjs > /tmp/fixture.log 2>&1 &
          sleep 8
          curl -fsS "http://$RUNNER_IP:8091/player_api.php?username=demo&password=demo&action=get_live_categories" > /dev/null

      - name: Start the app
        run: |
          DATA_DIR="$(mktemp -d)" PORT=8099 SESSION_SECRET=ci-ui-secret-0123456789 node dist/server/index.js > /tmp/app.log 2>&1 &
          sleep 5
          curl -fsS http://127.0.0.1:8099/api/health > /dev/null
          curl -fsS -X POST http://127.0.0.1:8099/api/auth/setup -H 'content-type: application/json' \
            -d '{"username":"chris","password":"rig-test-1","role":"admin"}' > /dev/null
          curl -fsS -c /tmp/cookies -X POST http://127.0.0.1:8099/api/auth/login -H 'content-type: application/json' \
            -d '{"username":"chris","password":"rig-test-1"}' > /dev/null
          curl -fsS -b /tmp/cookies -X POST http://127.0.0.1:8099/api/session/save -H 'content-type: application/json' \
            -d "{"server":"http://$RUNNER_IP:8091","username":"demo","password":"demo"}" > /dev/null

      - name: Run the scripted UI check
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/verify-ui.mjs

      - name: App log on failure
        if: failure()
        run: tail -100 /tmp/app.log || true

  build-and-push:
    needs: [check, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
