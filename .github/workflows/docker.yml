name: Docker

# Builds and publishes a multi-arch image (linux/amd64 + linux/arm64) to GitHub Container
# Registry on every push to main and on version tags — linux/arm64 specifically because a
# Synology NAS (this project's own first real deployment target beyond a dev machine) is very
# often ARM-based, not just Intel/AMD. QEMU (setup-qemu-action) is what lets the amd64 GitHub
# runner actually build the arm64 image, not just claim to.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  # The gate. Until 2026-09-20 this workflow only built and pushed, so a release with failing tests,
  # a type error or a lint error published anyway — which is how a duplicate switch case (unreachable
  # dead code) reached a tag, and how v0.31.0 shipped with two failing tests. The image build now
  # depends on it, so none of those can be published at all.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
