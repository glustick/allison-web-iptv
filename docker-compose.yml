services:
  allison-web-iptv:
    image: ghcr.io/glustick/allison-web-iptv:latest
    # Bounded on purpose: this app writes ffmpeg's stderr into its container log, and the
    # default json-file driver keeps every line for ever — a week of transcoding is hundreds
    # of MB. 10 MB × 3 files is plenty for the health page and any post-mortem.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      # The provider's XMLTV is ~97 MB gzipped and far larger parsed; Node's default heap could not
      # hold it, so the app died with "Ineffective mark-compacts near heap limit" in a restart loop.
      # That surfaced as the guide never loading plus a 502 from the proxy while it restarted.
      - NODE_OPTIONS=--max-old-space-size=6144
      - PORT=8085
      # REQUIRED: 16+ characters. Generate one with:  openssl rand -hex 24
      - SESSION_SECRET=REPLACE_WITH_YOUR_OWN_SECRET
      # All variable/persistent state (user accounts, hashed passwords, encrypted per-user
      # Xtream/IPTV credentials) lives under /appdata inside the container. The :rw mapping
      # below is what makes container/image updates keep that data — don't remove it.
      - DATA_DIR=/appdata
      # Only needed if your own network does TLS inspection (a corporate proxy, some
      # security appliances) — see the README's own account of hitting this directly.
      # Mount a PEM bundle into the container and point this at it if so:
      # - NODE_EXTRA_CA_CERTS=/certs/ca-bundle.pem
      # Where ffmpeg writes HLS segments during a transcode. Parked on a real volume rather than
      # the container's own writable layer for two reasons: the rootfs below is read-only, and a
      # *movie* keeps every segment for as long as it plays (so the viewer can scrub anywhere) —
      # a feature-length title at ~10 Mbps is comfortably into the gigabytes. Give this volume
      # room, and check the System tab's free-space readout if you are unsure.
      - TRANSCODE_TMP_DIR=/transcode
      # The video re-encode tier (a channel whose video this browser cannot decode) caps its output
      # at 1080p by default, so a 4K channel is not re-encoded at 4K on this CPU — which no NAS can
      # do in real time. Set 0 to keep the source's own resolution, or a lower number (720) to trade
      # picture for CPU headroom.
      # - TRANSCODE_VIDEO_MAX_HEIGHT=1080
      # Optional capped-CRF ceiling (kbit/s) on the same tier, for a host whose *network* rather
      # than its CPU is the limit: every viewer's output is relayed through it. Off unless set.
      # - TRANSCODE_VIDEO_MAXRATE_KBPS=8000
    volumes:
      # Persistent storage, mapped read-write: survives container recreation and image
      # updates. Without this, an update wipes accounts and everyone lands back on the
      # first-run admin setup screen.
      - ./appdata:/appdata:rw
      - ./transcode:/transcode:rw
      # - ./ca-bundle.pem:/certs/ca-bundle.pem:ro
    # --- Hardening ---------------------------------------------------------------------------
    # The image already runs the server as an unprivileged user; these are the container-level
    # settings worth keeping alongside it.
    #
    # ONE-TIME STEP FOR EXISTING INSTALLS: an ./appdata directory created by an earlier build (it
    # ran as root) is owned by root, and the server now writes as uid 1000. If the container
    # starts and reports the data directory is not usable, run on the host:
    #     sudo chown -R 1000:1000 ./appdata ./transcode
    # (Starting once with `user: "0:0"` below also fixes it automatically, then drops privileges.)
    read_only: true
    tmpfs:
      # ffmpeg and Node still want somewhere for scratch files; segments go to /transcode, so this
      # only has to hold small, transient things.
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Uncomment to have the entrypoint repair ownership of ./appdata and ./transcode on start
    # (it chowns, then drops to uid 1000). Leave commented out when the directories are already
    # owned correctly — running as root at all is what the rest of this block avoids.
    # user: "0:0" 
    # Also baked into the image's own Dockerfile (so a plain `docker run` gets it too) —
    # declared here as well so stack-management UIs that only read the compose file itself
    # (rather than inspecting the image) still surface health status.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8085)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
